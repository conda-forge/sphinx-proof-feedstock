{% set name = "sphinx-proof" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sphinx-proof-{{ version }}.tar.gz
  sha256: 5f01801242c375d7e1151c39a60d9979f95dff5f46f28e6bba4eb516b0813aad

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - docutils >=0.15
    - sphinx
    - sphinx-book-theme

test:
  imports:
    - sphinx_proof
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/executablebooks/sphinx-proof
  summary: A Sphinx extension for producing proofs, theorems, axioms, etc.
  dev_url: https://github.com/executablebooks/sphinx-proof
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - agoose77
